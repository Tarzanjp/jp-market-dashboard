# 東証の売買代金を毎営業日に取得して data/ にコミットする。
#
# GitHub Pages はこのリポジトリのルートをそのまま配信しているので、data/ に
# コミットした時点で公開ページにも反映される（ビルド工程は無い）。
name: JP market data update

on:
  schedule:
    # どちらも大引け（15:00 JST）より後。場中に走らせると、その時点までの
    # 部分的な売買代金を「その日の総額」として記録してしまう。
    - cron: "0 7 * * 1-5"      # 16:00 JST
    # 2本目は取りこぼし対策。Yahoo のランキングは最低15分遅れで、大引け直後は
    # まだ前営業日を返すことがある。その場合 1本目は「取引日が進んでいない」と
    # 判断して何も書かない（正しい）が、ランキングは最新セッションしか見せない
    # ので、そのままだとその日は永久に欠測になる。2本目で拾う。
    # 祝日なら2本とも同じ判断でスキップするだけなので、余計な書き込みは出ない。
    - cron: "30 8 * * 1-5"     # 17:30 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jp-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # 依存パッケージのインストールは無し。fetch_jp_market.py は標準
        # ライブラリだけで動く（意図的な選択。理由はスクリプトの docstring）。

      - name: Fetch turnover
        run: python automation/fetch_jp_market.py

      # 投資部門別は JPX が週次（火曜前後）で公表する。毎日叩いても新しい
      # ファイルが無ければ同じ週を upsert するだけなので、曜日で分岐せず毎日
      # 走らせる — 公表日がずれても取りこぼさない方を選ぶ。
      # 失敗しても turnover の更新は捨てたくないので continue-on-error。
      - name: Fetch investor-type (weekly, JPX .xls)
        continue-on-error: true
        run: python automation/fetch_jp_investor.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # 取得しても中身が同じ日（土日・祝日に走った場合など）は空コミットを
          # 作らない。履歴は date を鍵に upsert しているので再実行しても行は増えない。
          if git diff --cached --quiet; then
            echo "変更なし — コミットしない"
          else
            git commit -m "data: 東証売買代金スナップショット (auto)"
            git push
          fi
